<div class="grid gap-5 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
  @for(item of coursesItems(); track item.id){
  <div class="card rounded-md border border-gray-100 overflow-hidden shadow hover:shadow-2xl transition-shadow">
    <img [src]="item.image" [alt]="item.title" class="h-36 object-cover w-full">
    <div class="p-4">
      <h3 class="font-medium text-lg mb-1">{{item.title}}</h3>
      <p class="text-sm">{{item.discription.substring(0, 120)}}...</p>
    </div>
    <div class="py-3 px-4 border-t border-gray-200 flex justify-between items-center">
      <h5 class="text-sm font-bold">${{item.price | number:'1.2-2'}}</h5>
      <div class="flex flex-wrap gap-3">
        <p-button [rounded]="true" size="small" severity="info" icon="pi pi-info-circle" />
        <p-button [rounded]="true" size="small" severity="primary" icon="pi pi-pencil" (click)="editForm(item)" />
        <p-button [rounded]="true" size="small" severity="danger" icon="pi pi-trash" (click)="onDelate(item.id)" />
      </div>
    </div>
  </div>
  }
</div>
