<header class="px-5 shadow py-1 sticky top-0 z-50 bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto">
    <p-menubar [model]="items()!">
      <ng-template #start>
        <a routerLink="/">
          <img src="favicon.ico" alt="logo">
        </a>
      </ng-template>
      <ng-template #end>
        @if(!userData()){
        <div class="flex items-center gap-4">
          <a routerLink="/auth/login" routerLinkActive="text-primary font-medium" class="hover:text-primary transition">
            Login </a>
          <a routerLink="/auth/signup" routerLinkActive="text-primary font-medium"
            class="hover:text-primary transition">Signup</a>
        </div>
        } @else{
        <div class="flex items-center gap-4">
          <p>Hello, {{userData()?.email}}</p>
          <a routerLink="/auth/signup" routerLinkActive="text-white font-medium"
            class="hover:text-primary text-white p-2 rounded transition bg-red-500">Logout</a>
        </div>
        }
      </ng-template>
    </p-menubar>
  </div>
</header>
